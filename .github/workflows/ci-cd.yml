name: CI
on:
  pull_request:
    branches: [main]
    paths:
      - 'pipelines/mapainversiones-cali/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: mapainversiones-cali
  APP_DIR: pipelines/mapainversiones-cali
  TRIVY_VERSION: 0.76.1
  TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0

jobs:
  test:
    name: Lint + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pipelines/mapainversiones-cali
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipelines/mapainversiones-cali/requirements.lock
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.lock            # runtime exacto (incluye boto3) desde el lock
          python -m pip install -e ".[test]"                    # paquete + pytest + moto (declarados en pyproject)
          python -m pip install ruff==0.17.3 pip-audit==2.10.1  # tooling de CI (no va en el paquete)
      - name: Lint (ruff)
        run: ruff check --select E9,F63,F7,F82 .
      - name: Test
        run: |
          python -m pytest tests/unit
          mapainversiones-cali --list-runs
      - name: Audit dependencies (pip-audit)
        continue-on-error: true
        run: pip-audit -r requirements.lock --no-deps --disable-pip

  build-scan:
    name: Build + Trivy (PR)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build container (local, sin push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ${{ env.APP_DIR }}
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ env.IMAGE_NAME }}
          cache-to: type=gha,mode=max,scope=${{ env.IMAGE_NAME }}
      - name: Install Trivy (verified)
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum --check
          tar -xzf trivy.tar.gz trivy
      - name: Fecha para la caché de Trivy
        id: date
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Caché de la base de datos de Trivy
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ steps.date.outputs.day }}
          restore-keys: trivy-db-
      - name: Scan container image (Trivy)
        timeout-minutes: 10
        run: >-
          "$RUNNER_TEMP/trivy" image
          --scanners vuln
          --exit-code 1
          --severity HIGH,CRITICAL
          --ignore-unfixed
          --no-progress
          "${IMAGE_NAME}:${GITHUB_SHA}"

  ci-ok:
    name: CI OK
    if: always()
    needs: [test, build-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verificar resultado de los jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "Algún job falló o fue cancelado: $RESULTS"
              exit 1
            fi
          done