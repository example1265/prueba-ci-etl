name: CI/CD

on:
  pull_request:
    branches: [main]
    paths:
      - 'pipelines/mapainversiones-cali/**'
      - '.github/workflows/ci-cd.yml'
  push:
    branches: [main]
    paths:
      - 'pipelines/mapainversiones-cali/**'
      - '.github/workflows/ci-cd.yml'

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: mapainversiones-cali
  APP_DIR: pipelines/mapainversiones-cali
  TRIVY_VERSION: 0.76.1
  TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0

jobs:
  test:
    name: Lint + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pipelines/mapainversiones-cali
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipelines/mapainversiones-cali/requirements.lock
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip install pytest==8.4.2 "moto[s3]==5.1.0" ruff==0.17.3 pip-audit==2.10.1
      - name: Lint (ruff)
        run: ruff check --select E9,F63,F7,F82 .
      - name: Test
        run: |
          python -m pytest tests/unit
          mapainversiones-cali --list-runs
      - name: Audit dependencies (pip-audit)
        continue-on-error: true
        run: pip-audit -r requirements.lock --no-deps --disable-pip

  build-scan:
    name: Build + Trivy (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build container (local, sin push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ${{ env.APP_DIR }}
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ env.IMAGE_NAME }}
          cache-to: type=gha,mode=max,scope=${{ env.IMAGE_NAME }}
      - name: Install Trivy (verified)
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum --check
          tar -xzf trivy.tar.gz trivy
      - name: Fecha para la caché de Trivy
        id: date
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Caché de la base de datos de Trivy
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ steps.date.outputs.day }}
          restore-keys: trivy-db-
      - name: Scan container image (Trivy)
        timeout-minutes: 10
        run: >-
          "$RUNNER_TEMP/trivy" image
          --scanners vuln
          --exit-code 1
          --severity HIGH,CRITICAL
          --ignore-unfixed
          --no-progress
          "${IMAGE_NAME}:${GITHUB_SHA}"

  ci-ok:
    name: CI OK
    if: always() && github.event_name == 'pull_request'
    needs: [test, build-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verificar resultado de los jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "Algún job falló o fue cancelado: $RESULTS"
              exit 1
            fi
          done

  deploy:
    name: Build, scan, push y desplegar
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: dev
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-mapainversiones-cali
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build container (local, sin push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ${{ env.APP_DIR }}
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ env.IMAGE_NAME }}
          cache-to: type=gha,mode=max,scope=${{ env.IMAGE_NAME }}
      - name: Install Trivy (verified)
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum --check
          tar -xzf trivy.tar.gz trivy
      - name: Fecha para la caché de Trivy
        id: date
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Caché de la base de datos de Trivy
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ steps.date.outputs.day }}
          restore-keys: trivy-db-
      - name: Scan container image (Trivy)
        timeout-minutes: 10
        run: >-
          "$RUNNER_TEMP/trivy" image
          --scanners vuln
          --exit-code 1
          --severity HIGH,CRITICAL
          --ignore-unfixed
          --no-progress
          "${IMAGE_NAME}:${GITHUB_SHA}"
      - name: Conectarse a AWS mediante OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - name: Login a ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd
      - name: Publicar la imagen escaneada en ECR y capturar el digest
        id: push
        env:
          LOCAL: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          REMOTE: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          set -euo pipefail
          docker tag "$LOCAL" "$REMOTE"
          docker push "$REMOTE"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$REMOTE" | cut -d'@' -f2)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Descargar la task definition actual
        env:
          TASK_FAMILY: ${{ vars.ECS_TASK_FAMILY }}
        run: |
          aws ecs describe-task-definition \
            --task-definition "$TASK_FAMILY" \
            --query taskDefinition > task-definition.json
      - name: Poner la nueva imagen (por digest) en la task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@8d79160660ad39c402a16e5fc7cd2a32e8f7d6b7
        with:
          task-definition: task-definition.json
          container-name: ${{ vars.ECS_CONTAINER_NAME }}
          image: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}@${{ steps.push.outputs.digest }}
      - name: Registrar nueva revisión de la task definition en ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@a00d4d57ac0de1a99b39fe469f3d898d38717c2b
        timeout-minutes: 5
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
