name: Secret scan
 
# Dos modos:
# - PR/push a main: escaneo INCREMENTAL, solo los commits nuevos que trae
#   ese evento. Es lo que corre en el camino caliente de cada cambio.
# - schedule/workflow_dispatch: escaneo COMPLETO (archivos + historial
#   entero), como red de seguridad periódica, desacoplado de cuántos
#   commits se hagan en el día.
#
# Antes esto corria el escaneo completo (archivos + TODO el historial) en
# cada push Y en cada pull_request para los mismos commits -> el mismo
# historial se re-escaneaba muchas veces por cambio. Eso fue lo que agoto
# los creditos de Actions.
 
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 11 * * 1' # lunes 06:00 America/Bogota
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
 
      - name: Download verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL --retry 3 -o "$archive" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
 
      - name: Escaneo completo (archivos + historial) - schedule/manual
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gitleaks" dir --redact=100 --no-banner --no-color "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks" git --redact=100 --no-banner --no-color "$GITHUB_WORKSPACE"
 
      - name: Escaneo incremental (commits del PR)
        if: github.event_name == 'pull_request'
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact=100 --no-banner --no-color \
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" \
            "$GITHUB_WORKSPACE"
 
      - name: Escaneo incremental (commits del push a main)
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          # Rama nueva o historial reescrito: before viene en ceros, no hay
          # rango valido -> cae al escaneo completo para no perder cobertura.
          if [ "$before" = "0000000000000000000000000000000000000000" ]; then
            "$RUNNER_TEMP/gitleaks" git --redact=100 --no-banner --no-color "$GITHUB_WORKSPACE"
          else
            "$RUNNER_TEMP/gitleaks" git --redact=100 --no-banner --no-color \
              --log-opts="$before..${{ github.event.after }}" \
              "$GITHUB_WORKSPACE"